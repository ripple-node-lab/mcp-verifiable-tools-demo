[package]
name = "risc0-wasm-verify"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
risc0-zkvm = { version = "=3.0.6", default-features = false }
bincode = "1.3"
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.release]
opt-level = "z"
lto = true

[workspace]
