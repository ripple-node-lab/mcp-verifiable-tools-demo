name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        node: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run demo
  sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: docker compose --profile sidecar up --build -d --wait
      - run: npm ci
      - run: npm run build
      - run: SIDECAR_URL=http://127.0.0.1:4100 node --test tests/dist/sidecar.test.js
      - if: always()
        run: docker compose --profile sidecar down
