services:
  sidecar-mock:
    profiles: ["sidecar"]
    build:
      context: .
      dockerfile: sidecars/mock/Dockerfile
    ports:
      - "4100:4100"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4100/healthz"]
      interval: 2s
      timeout: 5s
      retries: 15
  sidecar-risc0:
    profiles: ["risc0"]
    build:
      context: .
      dockerfile: sidecars/risc0/Dockerfile
    environment:
      PORT: "4200"
      HOST: "0.0.0.0"
      RISC0_DEV_MODE: ${RISC0_DEV_MODE:-}
    ports:
      - "4200:4200"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4200/healthz"]
      interval: 5s
      timeout: 10s
      retries: 30
