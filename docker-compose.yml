services:
  sidecar-mock:
    profiles: ["sidecar"]
    build:
      context: .
      dockerfile: sidecars/mock/Dockerfile
    ports:
      - "4100:4100"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4100/healthz"]
      interval: 2s
      timeout: 5s
      retries: 15
  sidecar-risc0:
    profiles: ["risc0"]
    build:
      context: .
      dockerfile: sidecars/risc0/Dockerfile
    environment:
      PORT: "4200"
      HOST: "0.0.0.0"
      RISC0_DEV_MODE: ${RISC0_DEV_MODE:-}
      MAX_CONCURRENT_PROOFS: ${MAX_CONCURRENT_PROOFS:-1}
    ports:
      - "4200:4200"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4200/healthz"]
      interval: 5s
      timeout: 10s
      retries: 30
  sidecar-ezkl:
    profiles: ["ezkl"]
    build:
      context: .
      dockerfile: sidecars/ezkl/Dockerfile
    environment:
      PORT: "4300"
      HOST: "0.0.0.0"
      MAX_CONCURRENT_PROOFS: ${MAX_CONCURRENT_PROOFS:-1}
    ports:
      - "4300:4300"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4300/healthz"]
      interval: 5s
      timeout: 10s
      retries: 30
  sidecar-tlsn:
    profiles: ["tlsn"]
    build:
      context: .
      dockerfile: sidecars/tlsn/Dockerfile
    environment:
      PORT: "4400"
      HOST: "0.0.0.0"
      PUBLIC_URL: http://127.0.0.1:4400
      MAX_CONCURRENT_ATTESTATIONS: ${MAX_CONCURRENT_ATTESTATIONS:-1}
    ports:
      - "4400:4400"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4400/healthz"]
      interval: 5s
      timeout: 10s
      retries: 30
